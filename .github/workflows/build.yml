name: Build NixOS hosts

# Builds both hosts on every PR and on push to main.
# This is the safety net that catches "I broke something" BEFORE you run `fr`.
# Uses Garnix + nix-community + magic-nix-cache for fast incremental builds.

on:
  pull_request:
  push:
    branches:
      - main
      # Auto-flake-update creates PRs but GitHub blocks workflows on
      # GITHUB_TOKEN-created PRs (security). So also trigger on push to
      # the branch name update-flake-lock uses, so CI runs anyway.
      - update_flake_lock_action
      - "update_flake_lock_action/**"
  workflow_dispatch:

# Cancel in-progress builds when a PR gets new commits
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    # wine-wow64 from the affinity-nix fork is not in any binary cache and
    # takes well over 60 min on a 2-core runner (run 37601965808 was killed
    # mid-compile at exactly 60 min). Cached runs still finish in minutes.
    timeout-minutes: 240
    strategy:
      fail-fast: false   # if meo breaks, still try meo-work — diagnostic value
      matrix:
        host: [meo, meo-work]
    steps:
      - uses: actions/checkout@v4
      # The stock ubuntu runner has ~14 GB free, which is not enough to compile
      # wine-wow64 from the affinity-nix fork (run #191 died with 6 MB left).
      # This wipes preinstalled toolchains and hands the space to /nix.
      - name: Free disk space for Nix
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          # cache.garnix.io was removed 2026-10: the hostname no longer resolves.
          extra-conf: |
            substituters = https://cache.nixos.org https://nix-community.cachix.org https://hyprland.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      - name: Enable magic-nix-cache (Actions cache for Nix store paths)
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          # We have no FlakeHub account; without this the action logs a red
          # "FlakeHub registration required" error before falling back to GHA cache.
          use-flakehub: false
      - name: Build host configuration
        env:
          HOST: ${{ matrix.host }}
        run: |
          nix build ".#nixosConfigurations.${HOST}.config.system.build.toplevel" \
            --print-build-logs --show-trace
      - name: Show closure size
        env:
          HOST: ${{ matrix.host }}
        run: |
          path=$(readlink result)
          size=$(nix path-info -S "$path" | awk '{print $2}')
          human=$(numfmt --to=iec --suffix=B "$size")
          echo "::notice title=Closure size ${HOST}::${human} (${path})"
